version: '3'

vars:
  DATE: '{{now | date "2006-01-02 15:04:05 MST"}}'

  LDFLAGS: -ldflags "-X 'main.Date={{.DATE}}'"

  DIST_DIR: dist

      # Automatically fetches the latest Git tag or short commit hash
  VERSION: 
      sh: git describe --tags --always || echo "dev"

  # internal/terminal only has windows and darwin implementations, so
  # those are the only GOOS/GOARCH combinations that can build dmptool.
  PLATFORMS:
    - windows/amd64
    - windows/arm64
    - darwin/amd64
    - darwin/arm64

tasks:

  default:
    cmds:
      - task: dmptool

  dmptool:
    deps: [test]
    cmds:
      - go build {{.LDFLAGS}} -v .

  setup:
    vars:
      TASK_SHELL: sh
    cmds:
      - mkdir -p {{.DIST_DIR}}

  test:
    cmds:
      - go test ./...

  clean:
    cmds:
      - rm -rf {{.DIST_DIR}}

  build-all:
    desc: cross-compile release binaries for every supported platform into {{.DIST_DIR}}
    deps: [test, setup]
    cmds:
      - for: { var: PLATFORMS }
        task: build-platform
        vars:
          PLATFORM: '{{.ITEM}}'

  build-platform:
    internal: true
    vars:
      GOOS: '{{splitList "/" .PLATFORM | first}}'
      GOARCH: '{{splitList "/" .PLATFORM | last}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
      CGO_ENABLED: '0'
    cmds:
      - go build {{.LDFLAGS}} -o {{.DIST_DIR}}/dmptool-{{.VERSION}}-{{.GOOS}}-{{.GOARCH}}{{.EXT}} .
